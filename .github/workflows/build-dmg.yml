name: Build DMG

on:
  push:
    branches:
      - codex/multilingual-dmg
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned macOS DMG
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Archive app
        run: >
          xcodebuild archive
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -destination 'generic/platform=macOS'
          -archivePath "$RUNNER_TEMP/Compositor.xcarchive"
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_REQUIRED=NO

      - name: Create DMG
        run: |
          mkdir -p "$RUNNER_TEMP/dmg" dist
          cp -R "$RUNNER_TEMP/Compositor.xcarchive/Products/Applications/Compositor.app" "$RUNNER_TEMP/dmg/"
          hdiutil create \
            -volname "Compositor 1.4.6" \
            -srcfolder "$RUNNER_TEMP/dmg" \
            -ov \
            -format UDZO \
            "dist/Compositor-1.4.6-build41.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-1.4.6-build41-dmg
          path: dist/Compositor-1.4.6-build41.dmg
          if-no-files-found: error
          retention-days: 14
